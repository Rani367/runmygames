name: Release

# Builds RunMyGames.app for a version tag (vX.Y.Z) and publishes the GitHub release that
# install.sh downloads from.
#
# Engine tarballs are NOT built here. They are attached to their own `engine-<build>` releases,
# either with `make release-engine` on a Mac that has the engine installed, or with the manual
# engine.yml workflow. engine/manifest.json points at them.

on:
  push:
    tags: ["v*"]

# Never cancel a release half way through; queue a second push of the same tag instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ANALYTICS: 1

jobs:
  release:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 60
    env:
      # `if:` cannot read secrets, so compute a flag once. Without a Developer ID the release
      # ships ad-hoc signed, which is what install.sh expects today.
      NOTARIZE: >-
        ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != ''
        && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_API_KEY_ID != ''
        && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install mingw-w64

      - name: Check tag matches VERSION
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match VERSION ($VERSION). Bump VERSION, run 'make version', commit, then tag v$VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        run: make dist

      - name: Sign with Developer ID and notarize
        if: env.NOTARIZE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          APP=build/RunMyGames.app
          ZIP="dist/RunMyGames-$VERSION.zip"

          # Temporary keychain holding only the Developer ID certificate.
          KEYCHAIN="$RUNNER_TEMP/rmg-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application: .*($TEAM_ID)" \
            || { echo "::error::No 'Developer ID Application' identity for team $TEAM_ID in the certificate."; exit 1; }

          codesign --force --deep --options runtime --timestamp --keychain "$KEYCHAIN" \
            -s "Developer ID Application" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Notarize the zip, then staple the ticket to the app itself.
          rm -f "$ZIP"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$ZIP" --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          # Re-zip the stapled app and refresh the checksum install.sh verifies.
          rm -f "$ZIP"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          (cd dist && shasum -a 256 "$(basename "$ZIP")" > "$(basename "$ZIP").sha256")

      - name: Remove signing keychain
        if: always() && env.NOTARIZE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/rmg-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything under "## [x.y.z]" up to the next "## [" heading (or the link references).
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/RunMyGames-*.zip dist/RunMyGames-*.zip.sha256 \
            --title "RunMyGames $VERSION" --notes-file notes.md --verify-tag
