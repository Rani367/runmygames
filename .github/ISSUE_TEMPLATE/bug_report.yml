name: Bug report
description: Something in RunMyGames or `rmg` doesn't work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! If a specific game won't run but everything else works,
        the **Game compatibility report** template is a better fit.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of the problem. Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open RunMyGames
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: Output of `rmg diagnose`
      description: |
        Run `rmg diagnose` in Terminal and paste the output here. In the app, **Help > Copy Diagnostics**
        copies the same report to the clipboard. It lists your installed games and recent launch logs,
        with paths shortened so your macOS user name isn't included.
      render: text
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: e.g. MacBook Pro 14" (M3 Pro, 18 GB)
    validations:
      required: false
